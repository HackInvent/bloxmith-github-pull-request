<div class="modal-panel cw-github-pull-request-modal" role="dialog" aria-modal="true" aria-labelledby="{{ node_id }}BlockModalTitle" data-generic-block-modal-root data-block-runtime-refresh="autonomous" data-node-id="{{ node_id }}" data-node-kind="{{ node_kind }}">
  <div class="modal-header">
    <div>
      <span class="panel-kicker">Bloc {{ node_kind_title }}</span>
      <h2 id="{{ node_id }}BlockModalTitle">{{ node_title }}</h2>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" data-close-block-modal type="button">Fermer</button>
    </div>
  </div>

  {{ modal_body_html }}

  <div class="github-pull-request-modal-footer">
    <span class="field-hint">Le token reste masque. En dry-run, le bloc ne cree aucune PR et retourne seulement la requete planifiee.</span>
    <div class="modal-actions">
      <button class="ghost-btn" data-close-block-modal type="button">Annuler</button>
      <button class="solid-btn" data-block-apply type="button" disabled>Appliquer</button>
    </div>
  </div>
</div>
